name: Deploy to AWS Lambda

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: masinusa/team-captain-backend
  ECR_REGISTRY: 845488705767.dkr.ecr.us-east-1.amazonaws.com
  # LAMBDA_FUNCTION_NAME: team-captain-function

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1.7.0
        with:
          role-to-assume: arn:aws:iam::845488705767:role/masinusa-github-workflow
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./backend/
        run: |
          docker build -f ./docker/Dockerfile -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          echo "image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # - name: Update Lambda function
      #   run: |
      #     aws lambda update-function-code \
      #       --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
      #       --image-uri ${{ steps.build-image.outputs.image }}
